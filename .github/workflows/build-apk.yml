name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          echo "SDKMANAGER=$SDKMANAGER" >> $GITHUB_ENV
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html style.css data.js game.js sw.js manifest.webmanifest robots.txt icon-192.png icon-512.png www/

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publish APK in Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0-apk
          name: Маленькая Ферма v3 (APK)
          body: |
            Установочный файл Android (APK).

            Скачайте `app-debug.apk`, откройте его на телефоне и разрешите установку из неизвестных источников.
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: little-farm-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
